<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#171717" />
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#d8ff3e" stroke="#171717" stroke-width="3" filter="url(#shadow)" />
  <g transform="translate(32, 32) rotate(-12)">
    <!-- 8-point bold Pop Asterisk -->
    <line x1="0" y1="-19" x2="0" y2="19" stroke="#171717" stroke-width="4.5" stroke-linecap="round" />
    <line x1="-19" y1="0" x2="19" y2="0" stroke="#171717" stroke-width="4.5" stroke-linecap="round" />
    <line x1="-13.5" y1="-13.5" x2="13.5" y2="13.5" stroke="#171717" stroke-width="4.5" stroke-linecap="round" />
    <line x1="-13.5" y1="13.5" x2="13.5" y2="-13.5" stroke="#171717" stroke-width="4.5" stroke-linecap="round" />
    <!-- Center core pop -->
    <circle cx="0" cy="0" r="3" fill="#171717" />
  </g>
</svg>
