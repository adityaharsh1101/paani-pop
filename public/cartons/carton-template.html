<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaaniPop! carton template</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,800..900&family=Caveat:wght@700&family=DM+Sans:ital,wght@0,400;0,500;0,700;0,800;1,500&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=JetBrains+Mono:wght@600;700;800&family=Outfit:wght@800;900&family=Playfair+Display:ital,wght@1,700;1,800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet"><style>
:root{--ink:#161616;--cream:#F6F3EC;--pink:#FF6FB5;--lime:#D8FF3E;--blue:#4F66FF}
*{box-sizing:border-box}
body{margin:0;background:#EDEAE2;color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--cream);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:14px 24px}
.logo{font:900 22px/1 Archivo,sans-serif;font-stretch:80%;letter-spacing:-.5px;background:var(--lime);color:var(--ink);padding:6px 10px;transform:rotate(-2deg)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.tabs button,.btn{font:700 14px/1 "DM Sans",sans-serif;border:2px solid var(--cream);background:transparent;color:var(--cream);padding:9px 14px;border-radius:99px;cursor:pointer;min-height:40px}
.tabs button[aria-pressed=true]{background:var(--cream);color:var(--ink)}
.btn.solid{background:var(--pink);border-color:var(--pink);color:var(--ink)}
main{max-width:1320px;margin:0 auto;padding:28px 24px 60px}
.brand{display:none}.brand.on{display:block}
.top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:start}
@media(max-width:900px){.top{grid-template-columns:1fr}}
.stagebox{background:var(--cream);border:3px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);padding:16px 16px 18px;position:relative;overflow:hidden}
.stage{height:640px;perspective:2400px;display:grid;place-items:center;cursor:grab;touch-action:none;user-select:none}
.stage:active{cursor:grabbing}
.scaler{transform-style:preserve-3d;transform:translateY(40px) scale(.62)}
.carton{position:relative;width:0;height:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.carton.drag{transition:none}
.panel.face{position:absolute;left:-150px;top:-380px;backface-visibility:hidden}
.face.f-sideA,.face.f-sideB{filter:brightness(.9)}
.face.f-back{filter:brightness(.82)}
.roof{position:absolute;left:-150px;width:300px;transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;backface-visibility:hidden;border:0}
.gable{position:absolute;left:-150px;width:300px;height:110px;top:-110px;clip-path:polygon(0 100%,50% 0,100% 100%);backface-visibility:hidden;filter:brightness(.85)}
.fin{position:absolute;left:-150px;top:-24px;width:300px;height:24px;border-radius:4px 4px 0 0}
.views{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.views button{font:700 13px/1 "DM Sans",sans-serif;border:2px solid var(--ink);background:#fff;padding:9px 12px;border-radius:99px;cursor:pointer;min-height:40px}
.views button[aria-pressed=true]{background:var(--ink);color:var(--cream)}
.side h1{font:900 54px/.9 Archivo,sans-serif;font-stretch:78%;text-transform:uppercase;letter-spacing:-1.5px;margin:4px 0 10px}
.side p.lead{font-size:17px;line-height:1.45;margin:0 0 18px;max-width:52ch}
.form{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:18px;display:grid;gap:12px}
.form h2{font:800 15px/1 "JetBrains Mono",monospace;letter-spacing:1px;margin:0}
.form label{display:grid;gap:5px;font:700 13px/1 "DM Sans",sans-serif}
.form input{font:500 16px/1.2 "DM Sans",sans-serif;padding:10px 12px;border:2px solid #cfcac0;border-radius:10px;min-height:44px}
.form input:focus{outline:3px solid var(--blue);outline-offset:1px;border-color:var(--ink)}
.hint{font-size:13px;color:#555;line-height:1.4;margin:0}
.flatwrap{margin-top:34px}
.flathead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.flathead h2{font:900 30px/1 Archivo,sans-serif;font-stretch:80%;text-transform:uppercase;margin:0}
.flatscale{overflow:hidden}
.flat{display:flex;gap:0;width:max-content;transform-origin:0 0;border:2px solid var(--ink)}
.slot{position:relative}
.slot .lab{position:absolute;top:-22px;left:0;font:700 11px/1 "JetBrains Mono",monospace;letter-spacing:1px;color:#555}
.slot+.slot .panel{border-left:1px dashed rgba(0,0,0,.35)}
.glue{width:34px;height:760px;background:repeating-linear-gradient(45deg,#ddd8cc 0 8px,#cfc9bb 8px 16px);display:grid;place-items:center;font:700 11px/1 "JetBrains Mono",monospace;writing-mode:vertical-rl;color:#666}
.flatpad{padding-top:24px}
/* panels */
.panel{width:300px;height:760px;position:relative;overflow:hidden;padding:26px 24px 22px;display:flex;flex-direction:column}
.pp{display:flex;justify-content:space-between;align-items:center;border-top:2px solid currentColor;padding-top:9px;font:700 10.5px/1 "JetBrains Mono",monospace;letter-spacing:.5px}
.pp-logo{font:900 15px/1 Archivo,sans-serif;font-stretch:80%;letter-spacing:-.3px}
.legal{font-size:11px;line-height:1.4;opacity:.8;border-top:1px solid currentColor;padding-top:8px;margin-top:10px}
.contacts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.contacts li{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;word-break:break-all}
.contacts li.empty{display:none}
.contacts svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ph{border-bottom:2px dashed currentColor;opacity:.75}
.qrbox{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.qr{width:190px;height:190px;flex:none;background:#fff;border-radius:12px;padding:9px;display:grid;place-items:center}
.qr svg{width:100%;height:100%;display:block}
.qr .noqr{font:700 11px/1.3 "JetBrains Mono",monospace;color:#161616;text-align:center;border:2px dashed #161616;width:100%;height:100%;display:grid;place-items:center;border-radius:6px}
.qrlabel{font:700 13px/1.35 "JetBrains Mono",monospace}
@media print{
 @page{size:A4 landscape;margin:8mm}
 body{background:#fff}
 header,.top,.views,.flathead .hint,.noprint{display:none!important}
 main{padding:0;max-width:none}
 .brand{display:block!important;break-after:page}
 .flatwrap{margin:0}
 .flatscale{overflow:visible;height:auto!important}
 .flat{transform:none!important;zoom:.84}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

body{background:#EDEAE2}
.app{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:24px;max-width:1500px;margin:0 auto;padding:24px}
@media(max-width:1000px){.app{grid-template-columns:1fr}}
.panelform{background:#fff;border:3px solid #161616;border-radius:20px;padding:6px 18px 18px;align-self:start}
fieldset{border:0;border-top:2px solid #161616;margin:14px 0 0;padding:14px 0 0;display:grid;gap:10px}
fieldset:first-of-type{border-top:0}
legend{font:800 13px/1 "JetBrains Mono",monospace;letter-spacing:1px;padding:0 0 6px}
.fl{display:grid;gap:5px;font:700 13px/1.2 "DM Sans",sans-serif}
.fl small{font-weight:500;color:#666}
.fl input[type=text],.fl textarea,.fl select,.fl input[type=number]{font:500 15px/1.35 "DM Sans",sans-serif;padding:9px 11px;border:2px solid #cfcac0;border-radius:10px;min-height:42px;width:100%;background:#fff}
.fl textarea{resize:vertical;min-height:70px}
.fl input:focus,.fl textarea:focus,.fl select:focus{outline:3px solid #4F66FF;outline-offset:1px;border-color:#161616}
.colors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.colors label{display:flex;align-items:center;gap:8px;font:700 13px/1.2 "DM Sans",sans-serif}
.colors input{width:44px;height:36px;border:2px solid #cfcac0;border-radius:8px;padding:2px;background:#fff;flex:none}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:auto;min-height:34px;border:2px solid #161616;border-radius:99px;padding:4px 10px 4px 4px;display:flex;gap:6px;align-items:center;background:#fff;font:700 12px/1 "DM Sans";cursor:pointer}
.swatches i{width:22px;height:22px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.2)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn.dark{background:#161616;color:#F6F3EC;border-color:#161616}
.btn.line{border-color:#161616;color:#161616}
.previewcol{display:grid;gap:24px;align-content:start;min-width:0}
.previewcol>*,.flatwrap,.flatscale{min-width:0;max-width:100%}
.prevtop{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.logoprev{display:flex;align-items:center;gap:10px}
.logoprev img{max-width:120px;max-height:50px;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/12px 12px;border-radius:6px}
/* generic carton */
.t .panel{background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 100%);color:var(--ink);font-family:var(--bfont)}
.t .h{font-family:var(--hfont);font-weight:var(--hweight);font-stretch:var(--hstretch);font-style:var(--hstyle);text-transform:var(--hcase);letter-spacing:var(--hls)}
.t h2.h{font-size:var(--hsize);line-height:1;margin:0}
.t h3.h{font-size:26px;line-height:1.05;margin:6px 0 0}
.t .acc{color:var(--acc)}
.t .kick{font:700 12px/1.25 "JetBrains Mono",monospace;letter-spacing:1.5px;color:var(--kick);text-transform:uppercase}
.t .sub{font-size:16px;line-height:1.42;margin:14px 0 0}
.t .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.t .tags span{border:1.5px solid currentColor;border-radius:99px;padding:6px 11px;font-size:13px;font-weight:700}
.t .logo{max-width:var(--logow);max-height:110px;object-fit:contain;object-position:left center;display:block}
.t .name{font-family:var(--hfont);font-weight:var(--hweight);font-stretch:var(--hstretch);font-style:var(--hstyle);font-size:30px;line-height:1}
.t .items{display:grid;gap:9px;margin-top:14px}
.t .it{display:flex;gap:10px;font-size:14.5px;line-height:1.38}.t .it:before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--acc);margin-top:4px}
.t .card{background:var(--card);border:1.5px solid var(--cardb);border-radius:14px;padding:11px 13px;font-size:14.5px;line-height:1.38}
.t .step{display:flex;gap:11px;font-size:14.5px;line-height:1.38}.t .step .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg1);font:800 13px/28px "JetBrains Mono",monospace;text-align:center}
.t .quote{background:var(--card);border-radius:14px;padding:11px 13px;font:italic 500 16px/1.32 Fraunces,serif}
.t .stat{font-family:var(--hfont);font-weight:var(--hweight);font-stretch:var(--hstretch);font-size:52px;line-height:.95;color:var(--acc)}
.t .note{background:var(--ink);color:var(--bg1);border-radius:14px;padding:11px 13px;font-size:12.5px;line-height:1.4}
.t .foot{font-size:13px;line-height:1.4}
.t .qr{background:#fff}

<body>
<header><div class="logo">PAANI POP!</div><div style="flex:1;font:700 14px/1.3 'DM Sans'">Carton template · fill the form, the carton builds itself</div>
<div class="row"><button class="btn" id="bNew">Start blank</button><button class="btn" id="bSample">Load sample</button><button class="btn" id="bSave">Save brand file</button><label class="btn" style="display:inline-flex;align-items:center">Open brand file<input type="file" id="bOpen" accept=".json,application/json" hidden></label><button class="btn solid" id="printBtn">Print / save PDF</button></div></header>
<div class="app">
<form class="panelform" id="form" onsubmit="return false" aria-label="Carton details"></form>
<div class="previewcol">
<section class="brand on t" id="sec">
<div class="stagebox"><div class="stage" aria-label="3D carton preview, drag to rotate"><div class="scaler"><div class="carton"></div></div></div>
<div class="views" role="group" aria-label="Carton view"><button type="button" data-v="front">Front</button><button type="button" data-v="sideA">Side A</button><button type="button" data-v="back">Back</button><button type="button" data-v="sideB">Side B</button><button type="button" data-v="spin" aria-pressed="true">Spin</button></div></div>
<div class="flatwrap"><div class="flathead"><h2>Print wrap · 4 sides</h2><p class="hint">Panel 300×760 px ≈ 70×177 mm at print scale. Final dieline and bleed: from your carton printer. Tip: wrap a word in *stars* to colour it with the accent.</p></div>
<div class="flatscale"><div class="flatpad"><div class="flat" id="flat"></div></div></div></div>
</section></div></div>

      setupPositionAdjustPattern();

      }

      if (_dataCache == null) {

    var setupPositionProbePattern = function(row, col) {

        }

        }

      }

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;

      var row = _moduleCount - 1;

      var maxEcCount = 0;

          }
        }
      }

      return data;

      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }
