name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build project
        run: npm run build

      - name: Authenticate to Google Cloud
        if: ${{ env.HAVE_SA == 'true' }}
        env:
          HAVE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PAANI_POP != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PAANI_POP }}

      - name: Install Firebase CLI
        if: ${{ env.HAVE_SA == 'true' }}
        env:
          HAVE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PAANI_POP != '' }}
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        if: ${{ env.HAVE_SA == 'true' }}
        env:
          HAVE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PAANI_POP != '' }}
        run: |
          npx firebase-tools deploy --only hosting:paani-pop --project gen-lang-client-0758786889 --non-interactive
